name: Deploy to GitHub Pages

# Publie le site statique sur la branche gh-pages (source Pages : branche gh-pages).
# Ce mode s'active tout seul dès que la branche gh-pages existe — aucun réglage manuel.
on:
  push:
    branches: [main, claude/farse-festival-app-uyuamm]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp service worker cache version
        run: sed -i "s/__BUILD__/${GITHUB_SHA:0:8}/" sw.js
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: ".github,README.md"
